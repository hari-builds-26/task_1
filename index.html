
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopLite - Login</title>
  <link rel="stylesheet" href="login_screen.css">
</head>
<body>

  <main class="login-page">

    <!-- LEFT BRAND SECTION -->
    <section class="brand-panel">

      <div class="shape shape-top"></div>
      <div class="shape shape-bottom"></div>

      <a class="brand" href="#">
        <span class="brand-mark">
          <svg viewBox="0 0 40 40">
            <rect x="4" y="9" width="32" height="27" rx="5" fill="currentColor"/>
            <path d="M12 12V9a8 8 0 0 1 16 0v3"
              fill="none" stroke="#087d75"
              stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </span>
        <span>ShopLite</span>
      </a>

      <div class="brand-copy">
        <h1>
          Billing made simple<br>
          for <span>small shops</span>
        </h1>

        <p>
          Create invoices, track payments and<br class="desktop-break">
          see your sales in one place.
        </p>
      </div>

      <div class="illustration-wrap">
        <img
          src="Invoice Shop Growth Illustration.png"
          alt="Shop growth illustration"
          class="shop-illustration"
        >
      </div>

      <div class="stats">

        <div class="stat-card">
          <svg viewBox="0 0 42 42">
            <circle cx="21" cy="21" r="17"
              fill="none" stroke="currentColor" stroke-width="4"/>
            <path d="M21 10v12l8 5"
              fill="none" stroke="currentColor"
              stroke-width="4" stroke-linecap="round"/>
          </svg>

          <div>
            <strong>2 min</strong>
            <span>to create an invoice</span>
          </div>
        </div>

        <div class="stat-card">
          <svg viewBox="0 0 42 42">
            <path d="M5 17 9 8h24l4 9M7 17h28v17H7z"
              fill="none" stroke="currentColor"
              stroke-width="3.5" stroke-linejoin="round"/>
            <path d="M7 17c0 5 7 5 7 0 0 5 7 5 7 0 0 5 7 5 7 0 0 5 7 5 7 0"
              fill="none" stroke="currentColor"
              stroke-width="3.2" stroke-linecap="round"/>
          </svg>

          <div>
            <strong>10k+</strong>
            <span>shops use ShopLite</span>
          </div>
        </div>

      </div>
    </section>

    <!-- RIGHT LOGIN SECTION -->
    <section class="form-panel">

      <div class="corner-shape corner-top"></div>
      <div class="corner-shape corner-bottom"></div>

      <div class="login-form-wrap">

        <header class="form-heading">
          <h2>Welcome back</h2>
          <p>Log in to your ShopLite account</p>
        </header>

        <form class="login-form" action="dash_board.html" method="GET">

          <label for="email">Email</label>

          <input
            id="email"
            name="email"
            type="email"
            value="hariharan@shoplite.in"
            autocomplete="username"
          >

          <label for="password" class="password-label">
            Password
          </label>

          <input
            id="password"
            name="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
          >

          <div class="form-options">

            <label class="remember">
              <input type="checkbox" checked>
              <span class="custom-check"></span>
              <span>Remember me</span>
            </label>

            <a href="#">Forgot password?</a>

          </div>

          <button class="login-button" type="submit">
            Log in
          </button>

          <div class="separator">
            <span></span>
            <em>or</em>
            <span></span>
          </div>

          <button class="google-button" type="button">
            <span class="google-g">G</span>
            Continue with Google
          </button>

          <p class="signup-text">
            New to ShopLite?
            <a href="#">Create an account</a>
          </p>

        </form>
      </div>
    </section>

  </main>

</body>
</html>
